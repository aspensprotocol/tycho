specVersion: v0.1.0
package:
  name: "arbitrum_sushiswap_v2"
  version: v0.3.3
  url: "https://github.com/propeller-heads/tycho-protocol-sdk/tree/main/substreams/ethereum-uniswap-v2"

network: arbitrum-one

protobuf:
  files:
    - tycho/evm/v1/common.proto
    - uniswap.proto
  importPaths:
    - ./proto/v1
    - ../../../proto/

binaries:
  default:
    type: wasm/rust-v1
    file: ../target/wasm32-unknown-unknown/release/ethereum_uniswap_v2.wasm

modules:
  - name: map_pools_created
    kind: map
    # UniswapV2Factory creation block. Arbitrum One block numbers advanced slowly in the classic
    # era, so this is 2021-05-30; the first PairCreated follows at block 228460.
    initialBlock: 70
    inputs:
      - params: string
      - source: sf.ethereum.type.v2.Block
    output:
      type: proto:tycho.evm.v1.BlockChanges

  - name: store_pools
    kind: store
    initialBlock: 70
    updatePolicy: set_if_not_exists
    valueType: proto:tycho.evm.uniswap.v2.Pool
    inputs:
      - map: map_pools_created

  - name: map_pool_events
    kind: map
    initialBlock: 70
    inputs:
      - source: sf.ethereum.type.v2.Block
      - map: map_pools_created
      - store: store_pools
    output:
      type: proto:tycho.evm.v1.BlockChanges

params:
  map_pools_created: factory_address=c35DADB65012eC5796536bD9864eD8773aBc74C4&protocol_type_name=sushiswap_v2_pool
